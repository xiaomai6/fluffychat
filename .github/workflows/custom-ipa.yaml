name: Custom IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -y app-unsigned.ipa Payload
      - name: Create release and upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "custom-ipa-20261028-run1" --title "Custom FluffyChat IPA custom-ipa-20261028-run1" --notes "Unsigned custom FluffyChat IPA (default homeserver matrix.openaiapi.eu.org). Requires self-signing with AltStore or Sideloadly before installation; free Apple ID signatures expire after 7 days." build/ios/iphoneos/app-unsigned.ipa
